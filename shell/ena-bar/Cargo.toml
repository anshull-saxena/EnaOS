[package]
name = "ena-bar"
version = "0.1.0"
edition = "2024"
description = "EnaOS native AI bar — GTK4 layer-shell panel"
authors = ["EnaOS"]

[features]
default = ["layer-shell"]
timing = []
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk4 = { version = "0.11", package = "gtk4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = { version = "0.8", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 2
